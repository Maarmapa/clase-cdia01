name: Mis 5 preguntas
description: Comparte tus 5 preguntas sobre la TRM 2026, lo que respondió tu IA y cómo lo verificaste.
title: "Mis 5 preguntas"
labels: ["mis-5-preguntas"]
body:
  - type: markdown
    attributes:
      value: |
        Comparte tus 5 preguntas: lo que respondió tu IA y cómo lo verificaste. Es para conversar en clase; la entrega oficial sigue siendo en el campus del curso.

        **Esta repo es pública:** no pongas datos personales ni datos de tu empresa.
  - type: textarea
    id: pregunta-1
    attributes:
      label: "Pregunta 1"
      description: Tu pregunta, tal como se la hiciste a la IA.
    validations:
      required: true
  - type: textarea
    id: respuesta-1
    attributes:
      label: "Pregunta 1 · Lo que respondió la IA"
      description: Pega la respuesta y di qué IA usaste (ChatGPT, Gemini, Claude, Copilot, OpenCode u otra).
    validations:
      required: true
  - type: textarea
    id: verificacion-1
    attributes:
      label: "Pregunta 1 · Tu verificación"
      description: La fórmula o el cálculo con que lo comprobaste, y el resultado que te dio.
    validations:
      required: true
  - type: dropdown
    id: acerto-1
    attributes:
      label: "Pregunta 1 · ¿Acertó?"
      options:
        - "Sí"
        - "En parte"
        - "No"
    validations:
      required: true
